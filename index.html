<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Дашборд</title>
<meta name="viewport" content="width=1024, initial-scale=1, user-scalable=no">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#0b0f14;color:#fff;overflow:hidden;font-family:Roboto,Arial,sans-serif}
.box{position:absolute;overflow:hidden;box-sizing:border-box}
iframe{border:0;width:100%;height:100%;background:#111}
#map{left:0;top:0;width:60%;height:100%}
#clock{left:60%;top:0;width:40%;height:16%;padding:6px 14px;border-left:1px solid #222;background:#111821}
#time{font-size:60px;line-height:62px;font-weight:bold}
#date{font-size:17px;color:#9fb3c8}
#weather{left:60%;top:16%;width:40%;height:18%;padding:8px 14px;border-left:1px solid #222;border-top:1px solid #222}
#temp{font-size:44px;font-weight:bold;float:left;margin-right:16px;line-height:60px}
#wdesc{font-size:18px}
#wmore{font-size:14px;color:#9fb3c8;margin-top:3px}
#wloc{font-size:12px;color:#6b7d8f}
#radar{left:60%;top:34%;width:40%;height:34%;border-left:1px solid #222;border-top:1px solid #222}
#news{left:60%;top:68%;width:40%;height:32%;padding:6px 14px;border-left:1px solid #222;border-top:1px solid #222;background:#111821}
#news h3{margin:0 0 4px;font-size:13px;color:#e8a33d;text-transform:uppercase}
#news div.n{font-size:13px;line-height:16px;margin-bottom:5px;max-height:32px;overflow:hidden}
</style>
</head>
<body>

<div class="box" id="map"><iframe id="fmap"></iframe></div>

<div class="box" id="clock"><div id="time">--:--</div><div id="date"></div></div>

<div class="box" id="weather">
 <div id="temp">--°</div>
 <div id="wdesc">Завантаження…</div>
 <div id="wmore"></div>
 <div id="wloc">Львів · Open-Meteo</div>
</div>

<div class="box" id="radar"><iframe id="fradar"></iframe></div>

<div class="box" id="news"><h3>Останні новини</h3><div id="nlist"></div></div>

<script>
window.onerror=function(m,u,l){document.getElementById('wloc').innerHTML='ПОМИЛКА: '+m+' (рядок '+l+')';};
</script>

<script>
function pad(n){return n<10?'0'+n:''+n;}
var DAYS=['неділя','понеділок','вівторок','середа','четвер','пятниця','субота'];
var MONTHS=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
function tick(){
 var d=new Date();
 document.getElementById('time').innerHTML=pad(d.getHours())+':'+pad(d.getMinutes());
 document.getElementById('date').innerHTML=DAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();
}
tick();
setInterval(tick,10000);
</script>

<script>
function wcode(c){
 if(c===0)return 'Ясно';
 if(c<=2)return 'Мінлива хмарність';
 if(c===3)return 'Хмарно';
 if(c===45||c===48)return 'Туман';
 if(c>=51&&c<=57)return 'Мряка';
 if(c>=61&&c<=67)return 'Дощ';
 if(c>=71&&c<=77)return 'Сніг';
 if(c>=80&&c<=82)return 'Злива';
 if(c===85||c===86)return 'Снігопад';
 if(c>=95)return 'Гроза';
 return '';
}
function loadWeather(){
 var x=new XMLHttpRequest();
 x.open('GET','https://api.open-meteo.com/v1/forecast?latitude=49.84&longitude=24.03&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&wind_speed_unit=ms&timezone=Europe%2FKyiv&forecast_days=1',true);
 x.onreadystatechange=function(){
  if(x.readyState!==4)return;
  try{
   if(x.status!==200){document.getElementById('wdesc').innerHTML='Погода: помилка '+x.status;return;}
   var j=JSON.parse(x.responseText),c=j.current,d=j.daily;
   document.getElementById('temp').innerHTML=Math.round(c.temperature_2m)+'°';
   document.getElementById('wdesc').innerHTML=wcode(c.weather_code)+' (відчувається '+Math.round(c.apparent_temperature)+'°)';
   document.getElementById('wmore').innerHTML='Сьогодні '+Math.round(d.temperature_2m_min[0])+'…'+Math.round(d.temperature_2m_max[0])+'° · вітер '+Math.round(c.wind_speed_10m)+' м/с · опади '+d.precipitation_probability_max[0]+'%';
  }catch(e){
   document.getElementById('wdesc').innerHTML='Погода: збій '+e.message;
  }
 };
 x.send();
}
function loadNews(){
 var x=new XMLHttpRequest();
 x.open('GET','https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://www.pravda.com.ua/rss/view_news/'),true);
 x.onreadystatechange=function(){
  if(x.readyState!==4)return;
  var el=document.getElementById('nlist');
  try{
   if(x.status!==200){el.innerHTML='Новини: помилка '+x.status;return;}
   var it=JSON.parse(x.responseText).items||[],h='',i;
   for(i=0;i<it.length&&i<5;i++){h+='<div class="n">'+it[i].title+'</div>';}
   el.innerHTML=h||'Новини: порожньо';
  }catch(e){
   el.innerHTML='Новини: збій '+e.message;
  }
 };
 x.send();
}
loadWeather();
loadNews();
setInterval(loadWeather,900000);
setInterval(loadNews,300000);
document.getElementById('fradar').src='https://www.rainviewer.com/map.html?loc=49.84,24.03,7&oFa=0&oC=0&oU=0&oCS=1&oF=0&oAP=1&c=3&o=83&lm=1&layer=radar&sm=1&sn=1';
document.getElementById('fmap').src='https://radarua.com/';
</script>
</body>
</html>
